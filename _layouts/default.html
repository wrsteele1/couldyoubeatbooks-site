<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ site.url }}/img/{{ page.og_image | default: 'gorilla-cover.jpg' }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <link rel="preload" href="/fonts/luckiest-guy.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">Could <span class="you">You</span> Beat?</a>
      <nav class="nav" aria-label="Main">
        <a href="/gorilla/" {% if page.nav == 'gorilla' %}aria-current="page"{% endif %}>Gorilla</a>
        <a href="/grizzly/" {% if page.nav == 'grizzly' %}aria-current="page"{% endif %}>Grizzly</a>
        <a href="/great-white-shark/" {% if page.nav == 'shark' %}aria-current="page"{% endif %}>Shark</a>
        <a href="/schools/" {% if page.nav == 'schools' %}aria-current="page"{% endif %}>Schools &amp; Libraries</a>
        <a href="/about/" {% if page.nav == 'about' %}aria-current="page"{% endif %}>About</a>
      </nav>
    </div>
  </header>
  <main>
{{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <div><div class="motto">Real animals. Real facts. Wild challenges.</div>&copy; {{ 'now' | date: '%Y' }} {{ site.publisher }}. All rights reserved.</div>
      <div><a href="/about/">About</a> &middot; <a href="/schools/">Schools &amp; Libraries</a> &middot; <a href="mailto:hello@couldyoubeatbooks.com">Contact</a></div>
    </div>
  </footer>
  {% unless page.hide_mobile_cta %}<a class="btn mobile-cta" href="{% if page.url == '/schools/' %}/{% endif %}#notify">Get the free scorecard</a>{% endunless %}
</body>
</html>
